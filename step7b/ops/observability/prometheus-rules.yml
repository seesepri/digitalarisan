groups:
  - name: digital-arisan-sre
    rules:
      - alert: DigitalArisanHealthProbeFailure
        expr: probe_success{job="digital-arisan-synthetic"} < 1
        for: 2m
        labels:
          severity: critical
          dependency: application
        annotations:
          summary: Digital Arisan synthetic health check failed
      - alert: DigitalArisanReadinessLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(probe_http_duration_seconds_bucket{job="digital-arisan-synthetic"}[5m])) by (le)) > 0.75
        for: 10m
        labels:
          severity: warning
          dependency: application
        annotations:
          summary: Digital Arisan readiness latency exceeds SLO
      - alert: DigitalArisanReconciliationFailure
        expr: digital_arisan_reconciliation_failed_24h > 0
        for: 5m
        labels:
          severity: critical
          dependency: postgres
        annotations:
          summary: Financial reconciliation failure detected
      - alert: DigitalArisanProviderFailureSpike
        expr: digital_arisan_recent_payment_failures >= 5 or digital_arisan_recent_withdrawal_failures >= 5
        for: 5m
        labels:
          severity: warning
          dependency: provider
        annotations:
          summary: Provider failure spike detected
